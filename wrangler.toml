#:schema node_modules/wrangler/config-schema.json
name = "bolt"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2025-03-28"
pages_build_output_dir = "./build/client"
send_metrics = false

[placement]
mode = "smart"

   [[r2_buckets]]
   binding = "MEDIA"
   bucket_name = "coverfo-media"

# Workers AI — 홈 "📷 사진으로 물어보기"(functions/api/lens-ask.js)가 env.AI 로 부른다 (2026-10-09 추가)
[ai]
binding = "AI"
