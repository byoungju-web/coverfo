name: Setup and Build
description: Generic setup action
inputs:
  pnpm-version:
    required: false
    type: string
    default: '9.14.4'
  node-version:
    required: false
    type: string
    default: '20.18.0'

runs:
  using: composite

  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Set Node.js version to ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    # 일부 부품(@electron/node-gyp)을 GitHub 에서 ssh(git@github.com) 방식으로 받으려다
    # 키가 없어 "Permission denied (publickey)" 로 실패하는 일이 있어, https 방식으로 받게 바꿉니다.
    - name: Use HTTPS for GitHub git dependencies
      shell: bash
      run: |
        git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        git config --global --add url."https://github.com/".insteadOf "git@github.com:"

    - name: Install dependencies and build project
      shell: bash
      run: |
        pnpm install || (echo "pnpm install 실패 - 10초 후 한 번 더 시도합니다" && sleep 10 && pnpm install)
        pnpm run build
