    return el;
  }

  /* 부모(또는 그 위)에 'coverfo' 글자가 함께 있는 로고 자리인지 */
  function nearBrand(el) {
    var p = el.parentElement;
    for (var i = 0; i < 2 && p; i++) {
      if ((p.textContent || "").indexOf(BRAND) !== -1) return true;
      p = p.parentElement;
    }
    return false;
  }

  function sizeOf(cn, fallback) {
    if (cn.indexOf("w-7") !== -1) return 28;
    if (cn.indexOf("w-8") !== -1) return 32;
    if (cn.indexOf("w-9") !== -1) return 36;
    if (cn.indexOf("w-10") !== -1) return 40;
    return fallback;
  }

  function run() {
    var n = 0;

    /* A. 글자 'c' 한 개짜리 네모 배지 */
    var divs = document.querySelectorAll("div,span");
    for (var i = 0; i < divs.length; i++) {
      var el = divs[i];
      if (el.getAttribute("data-cf-done")) continue;
      var txt = (el.textContent || "").trim();
      if (txt !== "c" && txt !== "C") continue;
      var cn = (typeof el.className === "string") ? el.className : "";
      if (cn.indexOf("w-") === -1) continue;          /* 크기 지정된 배지만 */
      if (cn.indexOf("rounded") === -1) continue;     /* 둥근 배지만 */
      if (!nearBrand(el)) continue;
      el.setAttribute("data-cf-done", "1");
      el.parentNode.replaceChild(makeSvg(sizeOf(cn, 32)), el);
      n++;
    }

    /* B. 이미 svg 로 된 로고 */
    var svgs = document.querySelectorAll("svg");
    for (var j = 0; j < svgs.length; j++) {
      var sv = svgs[j];
      if (sv.getAttribute("data-cf-logo") || sv.getAttribute("data-cf-done")) continue;
      var w = parseInt(sv.getAttribute("width") || "0", 10);
      if (!w || w < 20 || w > 64) continue;           /* 로고 크기대만 */
      if (!nearBrand(sv)) continue;
      sv.setAttribute("data-cf-done", "1");
      var host = sv.parentElement;
      host.replaceChild(makeSvg(w), sv);
      n++;
    }
    return n;
  }

  var tries = 0;
  var timer = setInterval(function () {
    run();
    if (++tries > 40) clearInterval(timer);
  }, 150);
})();
</script>
</body>
</html>
