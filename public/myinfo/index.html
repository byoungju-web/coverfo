<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F2FF">
<title>내 정보 — coverfo</title>
<script src="/shorts/store.js?v=470"></script>
<!-- coverfo 👤 내 정보 (v482 · v483 내 사람들·알림 루틴·발자취를 설정에서 옮겨 옴) — 홈 하단 '내 정보' 탭에서 열린다 (홈 위 덮개 창 · cf-page.js)
     "포도야가 기억하는 나": 프로필 · 내 결정/내 쇼츠/기억 수 · 🧠 내 비서 기억(종류별 보기·더하기·지우기)
     · 데이터: /api/memory (op get · add · forget · set) — 기존 기억 센터와 같은 곳. 기억은 무료.
     · 건강·병원·약, 긴 숫자, 비밀번호는 서버가 저장하지 않는다 (memory.js blockedWhy).
     · 구독·계정·보안·로그아웃은 하단 '설정'(예전 내 정보 메뉴)에 그대로 있다. -->
<style>
:root{--bg:#F5F2FF;--card:#fff;--ink:#17132B;--sub:#6E6889;--line:#E4DFFF;--pri:#6C4DFF;--pri2:#3D7BFF;--soft:#EFEAFF;--err:#B42318;--ok:#0F7A4A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
button,input{font-family:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid rgba(108,77,255,.45);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
.tp{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.eb{font-size:11.5px;font-weight:800;letter-spacing:.18em;color:var(--pri)}
h1{margin:4px 0 0;font-size:28px;line-height:1.2;letter-spacing:-.03em;font-weight:900}
h1 span{display:block;color:var(--pri)}
.x{flex:none;height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--line);background:#fff;color:var(--pri);font-size:13.5px;font-weight:800}
.pf{margin:16px 0 22px;border-radius:24px;padding:18px;color:#fff;background:linear-gradient(135deg,#7C4DFF 0%,#6C4DFF 45%,var(--pri2) 100%);box-shadow:0 18px 36px -22px rgba(80,50,200,.9)}
.pf .r{display:flex;align-items:center;gap:12px}
.pf .av{flex:0 0 56px;height:56px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.pf .av svg{width:36px;height:36px}
.pf .nm{flex:1;min-width:0}
.pf .nm b{display:block;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf .nm small{display:block;font-size:12.5px;opacity:.9;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf .bg{flex:none;font-size:11px;font-weight:900;color:var(--pri);background:#fff;border-radius:999px;padding:4px 10px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.st button{border:0;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;padding:10px 4px;text-align:center}
.st b{display:block;font-size:20px;font-weight:900}
.st small{font-size:11.5px;font-weight:700;opacity:.92}
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.sec b{font-size:16.5px;display:flex;align-items:center;gap:6px}
.sec b svg{width:18px;height:18px;stroke:var(--pri);fill:none;stroke-width:2}
.sec button{border:0;background:none;color:var(--pri);font-size:13px;font-weight:800}
.mc{background:var(--card);border-radius:20px;padding:14px;margin:0 0 10px;box-shadow:0 10px 26px -22px rgba(60,40,150,.55)}
.mc .h{display:flex;align-items:center;gap:10px}
.mc .ic{flex:0 0 36px;height:36px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.mc .ic svg{width:19px;height:19px;stroke:var(--pri);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mc .h b{flex:1;font-size:15px}
.mc .ed{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:12.5px;font-weight:800}
.mc .ed[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.mc .v{margin:10px 0 0 46px;font-size:13.5px;color:var(--sub);line-height:1.55;word-break:keep-all}
.mc .v.e{color:#A9A3C4}
.edt{margin:10px 0 0 46px}
.edt .ch{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.edt .ch span{display:inline-flex;align-items:center;gap:4px;font-size:13px;background:#F6F4FD;border-radius:999px;padding:5px 6px 5px 11px}
.edt .ch button{width:22px;height:22px;border-radius:50%;border:0;background:#E7E2F8;color:var(--sub);font-size:11px;line-height:1}
.edt .ad{display:flex;gap:6px}
.edt input{flex:1;min-width:0;height:40px;border:1.5px solid var(--line);border-radius:12px;padding:0 11px;font-size:14px;background:#FBFAFF;color:var(--ink)}
.edt .ad button{flex:none;height:40px;padding:0 14px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-weight:800;font-size:13.5px}
.lk{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 8px;padding:14px;border-radius:16px;border:0;background:#fff;color:var(--ink);font-size:14.5px;font-weight:800;text-align:left;box-shadow:0 10px 26px -22px rgba(60,40,150,.55);text-decoration:none}
.lk span{flex:1}
.lk i{font-style:normal;color:var(--pri)}
.note{font-size:12.5px;color:var(--sub);line-height:1.6;margin:10px 2px}
.box{background:#fff;border-radius:18px;padding:16px;text-align:center;font-size:14px;line-height:1.6;color:var(--sub);margin-bottom:14px}
.box button{margin-top:10px;height:42px;padding:0 18px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-weight:800;font-size:14px}
.msg{min-height:18px;font-size:13px;text-align:center;margin:4px 0 8px;color:var(--ok)}
.msg.err{color:var(--err)}
</style>
</head>
<body>
<main class="wrap">
  <div class="tp"><div><div class="eb">MY INFO</div><h1>내 정보<span>포도야가 기억하는 나</span></h1></div><button type="button" class="x" id="close">✕ 닫기</button></div>
  <div id="main"><div class="box">불러오는 중…</div></div>
</main>
<script>
(function(){
  "use strict";
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }
  var GRAPE='<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 14 C 62 10, 68 8, 72 12 C 76 16, 74 24, 60 26 C 46 24, 44 16, 48 12 C 52 8, 58 10, 60 14 Z" fill="#2ECC71"/><circle cx="46" cy="70" r="26" fill="#8B5CF6" stroke="#fff" stroke-width="3"/><circle cx="76" cy="70" r="26" fill="#A78BFA" stroke="#fff" stroke-width="3"/></svg>';
  /* v484 포도야 포도 (글자 옆 작은 크기 · 🍇 이모지 대신) */
  var GI='<svg viewBox="0 0 120 120" aria-hidden="true" style="width:1.25em;height:1.25em;vertical-align:-.25em;margin-right:4px;flex:none"><path d="M60 14 C 62 10, 68 8, 72 12 C 76 16, 74 24, 60 26 C 46 24, 44 16, 48 12 C 52 8, 58 10, 60 14 Z" fill="#2ECC71"/><circle cx="46" cy="70" r="26" fill="#8B5CF6" stroke="#6D28D9" stroke-width="3"/><circle cx="76" cy="70" r="26" fill="#A78BFA" stroke="#6D28D9" stroke-width="3"/></svg>';
  var SP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg>';
  /* 기억 종류 (memory.js CATS 와 같은 이름) */
  var CAT=[
    ["like","좋아하는 것",'<path d="M7 3v8a3 3 0 0 0 3 3h0V21M7 3v5M10 3v5M17 21V3c-2 0-3 2-3 5v5h3"/>',"예) 삼겹살, 김치찌개, 바닐라 라떼"],
    ["place","자주 가는 장소",'<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',"예) 홍대, 성수, 제주 애월"],
    ["person","챙길 사람",'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',"예) 엄마 생일 5월 3일"],
    ["habit","자주 하는 일",'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>',"예) 금요일 저녁엔 영화"],
    ["me","나에 대해",'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',"예) 아침형 인간, 매운 음식 좋아함"]
  ];
  var S={tok:"",d:null,open:"",shorts:0};
  function tok(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf("sb-")===0&&k.indexOf("-auth-token")>0){ var v=JSON.parse(localStorage.getItem(k)||"null"); var t=v&&(v.access_token||(v.currentSession&&v.currentSession.access_token)); if(t) return {t:t,u:v.user||null}; } } }catch(e){} return null; }
  function jwt(t){ try{ var p=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(escape(atob(p+"===".slice((p.length+3)%4))))); }catch(e){ return {}; } }
  function mem(body){ return fetch("/api/memory",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+S.tok},body:JSON.stringify(body)}).then(function(r){ return r.json().catch(function(){ return {}; }); }).catch(function(){ return {error:"연결하지 못했어요"}; }); }
  function P(){ try{ return window.parent!==window?window.parent:null; }catch(e){ return null; } }
  /* 덮개 창을 닫고 홈에서 이어서 할 일 — 홈 쪽 함수로 건다 (mywork 와 같은 방식) */
  function closeTo(code){
    var p=P();
    if(p&&p.cfPageClose){ try{
      if(code){ var run=new p.Function("code","var ran=false,go=function(){ if(ran) return; ran=true; setTimeout(function(){ try{ (new Function(code))(); }catch(e){} },60); }; window.addEventListener('popstate',go,{once:true}); setTimeout(go,700);"); run(code); }
      p.cfPageClose(); return;
    }catch(e){} }
    location.href="/";
  }
  function msg(m,bad){ var e=$("msg"); if(e){ e.className="msg"+(bad?" err":""); e.textContent=m||""; } }
  $("close").onclick=function(){ if(/\/mywork\//.test(document.referrer||"")&&history.length>1){ history.back(); return; } closeTo(""); };

  function load(){
    var a=tok(); S.tok=a?a.t:"";
    if(window.cfShorts) cfShorts.list().then(function(l){ S.shorts=(l||[]).length; if(S.d||!S.tok) draw(); });
    if(!S.tok){ draw(); return; }
    var j=jwt(S.tok), um=(a.u&&a.u.user_metadata)||j.user_metadata||{}, mail=(a.u&&a.u.email)||j.email||"";
    S.user={name:um.full_name||um.name||um.nickname||"",handle:mail?mail.split("@")[0]:""};
    mem({op:"get"}).then(function(d){ S.d=d||{}; draw(); });
  }
  function draw(){
    var h="";
    if(!S.tok){
      h+='<div class="pf"><div class="r"><span class="av">'+GRAPE+'</span><span class="nm"><b>coverfo</b><small>로그인하면 포도야가 나를 기억해요</small></span></div><div class="st"><button type="button" data-go="mywork"><b>-</b><small>내 결정</small></button><button type="button" data-go="mywork"><b>'+S.shorts+'</b><small>내 쇼츠</small></button><button type="button"><b>-</b><small>기억</small></button></div></div>';
      h+='<div class="box">좋아하는 것 · 자주 가는 곳 · 챙길 사람을<br>포도야가 기억하고 알맞게 도와줘요.<br><button type="button" data-a="login">로그인하기</button></div>';
      $("main").innerHTML=h+links(); return;
    }
    var d=S.d||{}, items=d.items||[], me=d.me||{}, shares=((d.now&&d.now.shares)||[]).filter(function(x){ return x.kind==="pick"; });
    if(d.error&&!d.items){ $("main").innerHTML='<div class="box">'+esc(d.setup?d.error:'정보를 불러오지 못했어요 · '+d.error)+'</div>'+links(); return; }
    var name=me.name||(S.user&&S.user.name)||(S.user&&S.user.handle)||"나";
    h+='<div class="pf"><div class="r"><span class="av">'+GRAPE+'</span><span class="nm"><b>'+esc(name)+'</b><small>coverfo ID'+(S.user&&S.user.handle?' · @'+esc(S.user.handle):'')+(me.aname?' · 비서 이름 '+esc(me.aname):'')+'</small></span>'+(d.on?'<span class="bg">기억 켜짐</span>':'')+'</div>'
      +'<div class="st"><button type="button" data-go="mywork"><b>'+shares.length+'</b><small>내 결정</small></button><button type="button" data-go="mywork"><b>'+S.shorts+'</b><small>내 쇼츠</small></button><button type="button" data-a="top"><b>'+items.length+'</b><small>기억</small></button></div></div>';
    h+='<div class="sec"><b>'+SP+'내 비서 기억</b><button type="button" data-a="center">기억 센터 ›</button></div>';
    if(!d.on) h+='<div class="box" style="text-align:left">🧠 기억하기가 꺼져 있어요. 켜면 포도야가 대화·저장한 내용을 기억해요. 기억은 무료예요.<br><button type="button" data-a="on">기억하기 켜기</button></div>';
    h+='<div class="msg" id="msg" role="status"></div>';
    CAT.forEach(function(c){
      var list=items.filter(function(x){ return x.cat===c[0]; }), op=S.open===c[0];
      h+='<div class="mc"><div class="h"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">'+c[2]+'</svg></span><b>'+c[1]+'</b><button type="button" class="ed" data-ed="'+c[0]+'" aria-expanded="'+op+'">'+(op?'완료':'✎ 편집')+'</button></div>';
      if(op){
        h+='<div class="edt"><div class="ch">'+list.map(function(x){ return '<span>'+esc(x.text)+'<button type="button" data-del="'+esc(x.id)+'" aria-label="'+esc(x.text)+' 지우기">✕</button></span>'; }).join("")+'</div>'
          +'<div class="ad"><input id="in-'+c[0]+'" maxlength="80" placeholder="'+esc(c[3])+'" aria-label="'+c[1]+' 더하기"><button type="button" data-add="'+c[0]+'">더하기</button></div></div>';
      } else h+='<div class="v'+(list.length?'':' e')+'">'+(list.length?esc(list.slice(0,6).map(function(x){ return x.text; }).join(" · "))+(list.length>6?' 외 '+(list.length-6)+'개':''):'아직 없어요 · 편집을 눌러 알려 주세요')+'</div>';
      h+='</div>';
    });
    h+='<p class="note">건강·병원·약 이야기, 전화·카드·계좌 같은 긴 숫자, 비밀번호는 기억하지 않아요.</p>';
    /* v483 설정에서 옮겨 온 것: 👥 내 사람들(내 연락처) · ⏰ 내 알림·루틴 · 👣 내 발자취 — 기존 화면을 그대로 연다 */
    var book=items.filter(function(x){ return x.src==="book"; }), rms=(d.now&&d.now.reminds)||[], tr=!!(d.trail&&d.trail.on);
    h+='<div class="sec" style="margin-top:18px"><b>👥 내 사람들</b><button type="button" data-a="book">전체 보기 ›</button></div>'
      +'<div class="mc"><div class="v" style="margin:0">'+(book.length?esc(book.slice(0,3).map(function(x){ return x.text; }).join(" · "))+(book.length>3?' 외 '+(book.length-3)+'개':''):'연락처의 이름·생일을 올려 두면 포도야가 챙겨요')+'</div>'
      +'<div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="ed" data-a="book">📒 내 연락처 열기</button><a class="ed" href="/pdy/" style="display:inline-flex;align-items:center;text-decoration:none">'+GI+'생일 알림 맡기기</a></div></div>';
    h+='<div class="sec" style="margin-top:18px"><b>⏰ 내 알림 · 루틴</b><button type="button" data-a="my">전체 보기 ›</button></div>'
      +'<div class="mc">'+(rms.length?rms.slice(0,3).map(function(r){ var dt=new Date(r.next_at), when=isNaN(dt)?'':(dt.getMonth()+1)+'/'+dt.getDate()+' '+(dt.getHours()<10?'0':'')+dt.getHours()+':'+(dt.getMinutes()<10?'0':'')+dt.getMinutes(); return '<div class="v" style="margin:0 0 6px;color:var(--ink)"><b style="color:var(--pri);margin-right:6px">'+esc(when)+'</b>'+esc(r.text)+'</div>'; }).join(""):'<div class="v e" style="margin:0">다가오는 알림이 없어요 · 소리에게 "내일 9시 알려 줘" 해 보세요</div>')
      +'<div style="margin-top:8px"><button type="button" class="ed" data-a="my">⏰ 알림 · 한 마디 루틴 열기</button></div></div>';
    h+='<div class="sec" style="margin-top:18px"><b>👣 내 발자취</b><button type="button" data-a="trail">'+(tr?'끄기 · 자세히':'켜기')+' ›</button></div>'
      +'<div class="mc"><div class="v" style="margin:0">'+(tr?'<b style="color:var(--ok)">켜짐</b> · 빠른 실행·사진 물어보기·만들기 요청을 계정에 짧게 남겨요 (90일 뒤 지워짐)':'<b>꺼짐</b> · 켜면 홈 \'이어서 하기\'·아침 브리핑에 써요')+'</div></div>';
    $("main").innerHTML=h+links();
    if(S.open){ var i=$("in-"+S.open); if(i) i.focus(); }
  }
  function links(){
    return '<div class="sec" style="margin-top:18px"><b>포도야 설정</b></div>'
      +'<a class="lk" href="/pdy/"><span>'+GI+'포도야알림 · 기념일</span><i>›</i></a>'
      +'<a class="lk" href="/brief" target="_top"><span>☀️ 아침 브리핑</span><i>›</i></a>'
      +'<button type="button" class="lk" data-a="settings"><span>⚙️ 설정 · 구독 · 계정 · 로그아웃</span><i>›</i></button>';
  }
  function addItem(cat){
    var i=$("in-"+cat), t=i?i.value.trim():""; if(t.length<2){ msg("두 글자 이상 적어 주세요",true); return; }
    mem({op:"add",text:t,cat:cat,src:"center"}).then(function(r){
      if(r&&r.ok){ if(r.item){ S.d.items=(S.d.items||[]).filter(function(x){ return x.id!==r.item.id; }); S.d.items.unshift(r.item); } draw(); msg(r.same?"이미 기억하고 있어요":"✓ 기억했어요"); }
      else msg((r&&(r.note||r.error))||"저장하지 못했어요",true);
    });
  }
  document.addEventListener("click",function(e){
    var t=e.target&&e.target.closest?e.target:null; if(!t) return;
    var b=t.closest("[data-ed]"); if(b){ var k=b.getAttribute("data-ed"); S.open=S.open===k?"":k; draw(); return; }
    b=t.closest("[data-add]"); if(b){ addItem(b.getAttribute("data-add")); return; }
    b=t.closest("[data-del]"); if(b){ var id=b.getAttribute("data-del"); b.disabled=true; mem({op:"forget",id:id}).then(function(r){ if(r&&r.ok!==false&&!r.error){ S.d.items=(S.d.items||[]).filter(function(x){ return String(x.id)!==String(id); }); draw(); msg("✓ 지웠어요"); } else { b.disabled=false; msg((r&&(r.error||r.note))||"지우지 못했어요",true); } }); return; }
    b=t.closest("[data-go]"); if(b){ location.href="/mywork/"; return; }
    b=t.closest("[data-a]"); if(!b) return;
    var a=b.getAttribute("data-a");
    if(a==="on"){ mem({op:"set",on:true}).then(function(){ load(); }); return; }
    if(a==="top"){ window.scrollTo({top:document.querySelector(".mc")?document.querySelector(".mc").offsetTop-20:0,behavior:"smooth"}); return; }
    if(a==="book"){ closeTo("var a=document.createElement('button'); a.setAttribute('data-cf-book','1'); a.style.display='none'; document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); },0);"); return; }
    if(a==="my"){ closeTo("if(window.cfMyOpen) cfMyOpen('my');"); return; }
    if(a==="trail"){ closeTo("if(window.cfMyOpen) cfMyOpen('trail');"); return; }
    if(a==="center"){ closeTo("if(window.cfMem&&cfMem.open) cfMem.open({});"); return; }
    if(a==="login"){ closeTo("var q=document.querySelector('#cf-auth .cf-primary'); if(q) q.click();"); return; }
    if(a==="settings"){ closeTo("var b=document.querySelector('#v4-tabbar [data-v4t=\"set\"]'); if(b) b.click();"); return; }
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Enter"&&e.target&&e.target.id&&e.target.id.indexOf("in-")===0){ e.preventDefault(); addItem(e.target.id.slice(3)); } });
  window.addEventListener("pageshow",function(e){ if(e.persisted) load(); });
  load();
})();
</script>
