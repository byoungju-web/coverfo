<script>
(function(){
  "use strict";

  function grape(cls){ return '<svg class="'+(cls||"")+'" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 14 C 62 10, 68 8, 72 12 C 76 16, 74 24, 60 26 C 46 24, 44 16, 48 12 C 52 8, 58 10, 60 14 Z" fill="#2ECC71"/><circle cx="46" cy="70" r="26" fill="#8B5CF6" stroke="#6D28D9" stroke-width="3"/><circle cx="76" cy="70" r="26" fill="#A78BFA" stroke="#6D28D9" stroke-width="3"/></svg>'; }

  function auth(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf("sb-")===0&&k.indexOf("-auth-token")>0){ var v=JSON.parse(localStorage.getItem(k)||"null"); var t=v&&(v.access_token||(v.currentSession&&v.currentSession.access_token)); if(t) return t; } } }catch(e){} return ""; }
  function api(path,body){

    if(!tok) return Promise.resolve({status:401,login:true,error:"로그인이 필요해요"});

    var box=$("pushBox"); if(!box) return;
    if(window.CoverfoApp){ box.innerHTML='<div class="sr"><span class="t"><b>🔔 coverfo 소리 앱</b><small>앱에서는 아래 카톡이나 앱 알림으로 받아요</small></span></div>'; return; }
    if(!pushOk()){ box.innerHTML='<div class="sr"><span class="t"><b>🔔 이 브라우저 알림</b><small>이 브라우저는 웹 알림을 지원하지 않아요. 크롬·엣지에서 열어 주세요</small></span></div>'; return; }
    navigator.serviceWorker.getRegistration("/brief").then(function(reg){
      if(!reg||!reg.pushManager) return false;
      return reg.pushManager.getSubscription().then(function(sub){ return !!sub&&Notification.permission==="granted"; });
    }).catch(function(){ return false; }).then(function(on){
      var b=$("pushBox"); if(!b) return;
      b.innerHTML='<div class="sr"><span class="t"><b>🔔 이 브라우저로 받기</b><small>'+(on?'켜져 있어요 · 이 브라우저로 알림이 와요':'꺼져 있어요 · 눌러서 알림 허용')+'</small></span>'+(on?'<button type="button" class="pill" style="background:var(--soft);color:var(--pri2)" data-a="ptest">시험 알림</button>':'<button type="button" class="pill" style="background:var(--pri);color:#fff" data-a="pon">켜기</button>')+'</div>';
    });
  }
  function b64ToBytes(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; var r=atob(s), a=new Uint8Array(r.length); for(var i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; }
  function waitActive(reg){ return new Promise(function(res){ if(reg.active){ res(reg); return; } var w=reg.installing||reg.waiting; if(!w){ res(reg); return; } w.addEventListener("statechange",function(){ if(w.state==="activated") res(reg); }); setTimeout(function(){ res(reg); },8000); }); }
  function pushOn(){
    Notification.requestPermission().then(function(p){
      if(p!=="granted") throw new Error("알림이 차단돼 있어요. 주소창 왼쪽 자물쇠(또는 ⓘ) → 알림 → 허용으로 바꾼 뒤 다시 눌러 주세요.");
      return navigator.serviceWorker.register("/brief-sw.js",{scope:"/brief"});
    }).then(waitActive).then(function(reg){
      return api("/api/hub",{op:"push_key"}).then(function(k){
        if(!k.key) throw new Error("웹 알림 설정이 아직 없어요");
        return reg.pushManager.getSubscription().then(function(old){ return old||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(k.key)}); });
      });
    }).then(function(sub){ return api("/api/hub",{op:"push_sub",sub:sub.toJSON()}); })
      .then(function(){ pushInit(); toast("✓ 이 브라우저로 알림을 받아요",true); })
      .catch(function(e){ toast((e&&e.message)||"알림을 켜지 못했어요"); });
  }

  /* ── 누르기 ── */
  document.addEventListener("click",function(e){
    var t=e.target&&e.target.closest?e.target:null; if(!t) return;
    var b=t.closest("#tabs [data-tab]"); if(b){ setTab(b.getAttribute("data-tab")); return; }
    if(t.closest("#shbg")){ sheetClose(); return; }
    b=t.closest("[data-g]");
    if(b&&GS){
      e.preventDefault();
      var g=b.getAttribute("data-g"), i=+b.getAttribute("data-i"), it=GS.list[i];
      if(g==="close"){ sheetClose(); return; }
      if(g==="shop"&&it){ shop(it[1]); return; }
      if(g==="pick"){ var at=GS.sel.indexOf(i); if(at>=0) GS.sel.splice(at,1); else GS.sel.push(i); giftDraw(); return; }
      if(g==="save"&&it){ var d0=GS.d; api("/api/pdy",{op:"day_edit",id:d0.id,gift:it[0]+" "+it[1]}).then(function(j){ if(!j.ok){ $("gmsg").textContent=j.error||"저장하지 못했어요"; return; } var x=dayById(d0.id); if(x) x.gift=j.day.gift; sheetClose(); draw(); toast("✓ 선물을 정했어요. 알림에 같이 적어 둘게요 🎁",true); }); return; }
      if(g==="ask"){ var items=GS.sel.map(function(k){ return {emoji:GS.list[k][0],name:GS.list[k][1],desc:""}; }); makeLink(GS.d.title+" 선물 뭐로 할까?",items,$("gres"),$("gmsg"),b); return; }
      return;
    }
    b=t.closest("[data-l]"); if(b){ e.preventDefault(); linkAct(b.getAttribute("data-l"),$("pmsg")||$("gmsg")||$("msg")); return; }
    b=t.closest("[data-on]"); if(b){ var id=b.getAttribute("data-on"), d=dayById(id); if(!d) return; var nv=!d.is_on; d.is_on=nv; b.setAttribute("aria-checked",String(nv)); api("/api/pdy",{op:"day_edit",id:id,is_on:nv}).then(function(j){ if(!j.ok){ d.is_on=!nv; draw(); toast(j.error||"바꾸지 못했어요"); } else if(TAB==="days") draw(); }); return; }
    b=t.closest("[data-fr]"); if(b&&FORM){ formGrab(); FORM.rel=b.getAttribute("data-fr"); draw(); return; }
    b=t.closest("[data-fk]"); if(b&&FORM){ formGrab(); FORM.kind=b.getAttribute("data-fk"); draw(); return; }
    b=t.closest("[data-bh]"); if(b){ var v=b.getAttribute("data-bh"); if(v==="off") briefSave({on:false}); else briefSave({on:true,hh:+v,mm:0}); return; }
    b=t.closest("[data-bf]"); if(b){ var f=b.getAttribute("data-bf"); briefSave({days:f==="weekday"?[1,2,3,4,5]:f==="weekend"?[0,6]:[0,1,2,3,4,5,6]}); return; }
    b=t.closest("[data-qt]"); if(b){ var q=QT[+b.getAttribute("data-qt")]; pickInit(q[2],q[3]); draw(); return; }
    b=t.closest("[data-set]"); if(b&&!b.disabled){ var k=b.getAttribute("data-set"), p={}; p[k]=!D.set[k]; setSave(p); return; }
    b=t.closest("[data-hh]"); if(b){ setSave({hh:+b.getAttribute("data-hh")}); return; }
    b=t.closest("[data-tone]"); if(b){ setSave({tone:b.getAttribute("data-tone")}); return; }
    b=t.closest("[data-a]"); if(!b) return;
    var a=b.getAttribute("data-a");
    if(a==="login"){ closePage(); setTimeout(function(){ try{ var P=window.parent!==window?window.parent:window; var els=P.document.querySelectorAll("button,a"); for(var i2=0;i2<els.length;i2++){ var tx=(els[i2].textContent||"").trim(); if(tx==="로그인하기"||tx==="로그인"||tx==="로그인 / 가입"){ els[i2].click(); break; } } }catch(er){} },250); return; }
    if(a==="reload"){ load(); return; }
    if(a==="newday"){ FORM={title:"",rel:"가족",kind:"yearly",date:"",dom:25,memo:""}; setTab("days"); setTimeout(function(){ var x=$("fT"); if(x) x.focus(); },50); return; }
    if(a==="fcancel"){ FORM=null; draw(); return; }
    if(a==="fsave"){ formSave(b); return; }
    if(a==="days"){ setTab("days"); return; }
    if(a==="gift"){ var gd=dayById(b.getAttribute("data-id")); if(gd) giftOpen(gd); return; }
    if(a==="memo"){ var md=dayById(b.getAttribute("data-id")); if(!md) return; var nm=window.prompt("메모 (60자까지)",md.memo||""); if(nm==null) return; api("/api/pdy",{op:"day_edit",id:md.id,memo:nm}).then(function(j){ if(!j.ok){ toast(j.error||"저장하지 못했어요"); return; } md.memo=j.day.memo; draw(); }); return; }
    if(a==="del"){ var dd=dayById(b.getAttribute("data-id")); if(!dd||!window.confirm('"'+dd.title+'" 알림을 지울까요?')) return; api("/api/pdy",{op:"day_del",id:dd.id}).then(function(j){ if(!j.ok){ toast(j.error||"지우지 못했어요"); return; } D.days=D.days.filter(function(x){ return x.id!==dd.id; }); draw(); }); return; }
    if(a==="bookadd"){ var mine=(D.days||[]).map(function(d){ return d.title; }); var bk=(D.book||[]).filter(function(x){ return mine.indexOf(x.title)<0; })[+b.getAttribute("data-i")]; if(!bk) return; b.disabled=true; api("/api/pdy",{op:"day_add",title:bk.title,rel:"",kind:"yearly",md:bk.md,memo:""}).then(function(j){ if(!j.ok){ b.disabled=false; toast(j.error||"옮기지 못했어요"); return; } D.days.push(j.day); draw(); toast("✓ 포도야 알림으로 옮겼어요",true); }); return; }
    if(a==="wxhere"){ wxHere(b); return; }
    if(a==="invite"){ var it="🍇 기념일·아침 브리핑을 챙겨 주는 포도야 알림 친구 👉 https://coverfo.com/pdy/"; if(navigator.share&&!window.CoverfoApp){ navigator.share({title:"포도야 알림 친구",text:it}).catch(function(){}); } else { try{ navigator.clipboard.writeText(it).then(function(){ toast("✓ 링크를 복사했어요. 카톡에 붙여넣기 하세요.",true); }); }catch(e){ window.prompt("아래 링크를 복사하세요",it); } } return; }
    if(a==="recgo"){ var rc=recPick(D.weather); pickInit(rc.q,rc.c); setTab("pick"); return; }
    if(a==="pcadd"){ pickGrab(); if(PICK.c.length<6) PICK.c.push({e:"⭐",n:""}); draw(); var ins=document.querySelectorAll("[data-pc]"); if(ins.length) ins[ins.length-1].focus(); return; }
    if(a==="pcrm"){ pickGrab(); PICK.c.splice(+b.getAttribute("data-i"),1); draw(); return; }
    if(a==="pask"){
      pickGrab(); var mg=$("pmsg"); mg.className="msg";
      var items=PICK.c.map(function(x){ return {emoji:x.e||"⭐",name:String(x.n||"").trim(),desc:""}; }).filter(function(x){ return x.name; });
      if(!String(PICK.q||"").trim()){ mg.textContent="무엇을 정할지 적어 주세요"; return; }
      if(items.length<2){ mg.textContent="후보를 2개 이상 적어 주세요"; return; }
      makeLink(PICK.q.trim(),items,$("pres"),mg,b); return;
    }
    if(a==="pon"){ pushOn(); return; }
    if(a==="ptest"){ api("/api/hub",{op:"push_test"}).then(function(j){ toast(j.sent?"✓ 시험 알림을 보냈어요":"보낼 곳이 없어요. 알림을 다시 켜 주세요",!!j.sent); }); return; }
  });
  document.addEventListener("submit",function(e){
    var f=e.target; if(!f||f.getAttribute("data-f")!=="say") return;
    e.preventDefault(); var q=($("sayq").value||"").trim(); pickInit(q||"",null); setTab("pick");
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&$("sh").classList.contains("on")) sheetClose(); });
  var m0=/[?&]tab=(home|brief|days|pick|set)\b/.exec(location.search); if(m0) TAB=m0[1];
  [].forEach.call(document.querySelectorAll("#tabs button"),function(b){ b.setAttribute("aria-selected",String(b.getAttribute("data-tab")===TAB)); });
  load();
})();
</script>
