<!DOCTYPE html>
<!-- © 2026 coverfo All Rights Reserved — coverfo 3D Orchestrator Engine™ v4.1 (coverfo.com / Cloudflare) -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coverfo 3D Orchestrator Engine™</title>
<style>
  :root { --ink:#111; --sub:#6b6b6b; --line:rgba(0,0,0,.07); --bg:#FCFCFD; --card:#fff; --ok:#10B981; --run:#5B6CFF; --bad:#ef4444; --skip:#b5b5b5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  .wrap { max-width:1120px; margin:0 auto; padding:16px 16px 60px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0 14px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.02em; font-size:16px; }
  .brand b { background:linear-gradient(90deg,#5B6CFF,#8B5CF6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand small { font-weight:600; color:var(--sub); font-size:11px; letter-spacing:.06em; }
  .home { font-size:13px; text-decoration:none; padding:7px 12px; border:1px solid var(--line); border-radius:999px; background:#fff; }
  .env { display:flex; gap:6px; flex-wrap:wrap; }
  .env span { font-size:10.5px; padding:3px 8px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--sub); }
  .env span.on { color:#065f46; background:#ecfdf5; border-color:#a7f3d0; }
  .env span.off { color:#991b1b; background:#fef2f2; border-color:#fecaca; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  textarea { width:100%; min-height:84px; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:15px; line-height:1.55; resize:vertical; outline:none; font-family:inherit; }
  textarea:focus { border-color:#5B6CFF; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .btn { height:40px; padding:0 16px; border-radius:999px; border:1px solid var(--line); background:#fff; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn.primary { background:#111; color:#fff; border-color:#111; }
  .btn.green { background:var(--ok); color:#fff; border-color:var(--ok); }
  .btn:disabled { opacity:.5; cursor:default; }
  label.chk { font-size:13px; color:var(--sub); display:inline-flex; gap:6px; align-items:center; }
  .note { font-size:12px; color:var(--sub); margin-left:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; margin-top:14px; }
  .st { position:relative; background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; min-height:120px; }
  .st .num { font-size:10px; color:var(--sub); letter-spacing:.1em; }
  .st .name { font-weight:800; font-size:14px; margin-top:2px; }
  .st .model { font-size:10.5px; color:var(--sub); font-family:ui-monospace,Menlo,monospace; margin-top:2px; word-break:break-all; }
  .st .pill { position:absolute; top:12px; right:12px; font-size:10px; padding:3px 8px; border-radius:999px; background:#f5f5f5; color:var(--sub); }
  .st.run .pill { background:#eef0ff; color:var(--run); }
  .st.ok .pill { background:#ecfdf5; color:#047857; }
  .st.bad .pill { background:#fef2f2; color:#b91c1c; }
  .st.skip .pill { background:#f5f5f5; color:var(--skip); }
  .st .time { font-size:11px; color:var(--sub); margin-top:8px; }
  .st .out { margin-top:8px; font-size:12px; color:#333; }
  .st .out pre { margin:0; white-space:pre-wrap; word-break:break-word; font-size:11px; background:#fafafa; border:1px solid var(--line); border-radius:8px; padding:8px; max-height:140px; overflow:auto; }
  .st .out img, .st .out video { width:100%; border-radius:10px; border:1px solid var(--line); display:block; margin-top:6px; background:#000; }
  .st .out a { font-size:12px; }
  .log { margin-top:14px; background:#0b0b0e; color:#d7d7de; border-radius:14px; padding:12px 14px; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; line-height:1.6; max-height:240px; overflow:auto; }
  .log .t { color:#6b6f80; margin-right:8px; }
  .log .ok { color:#7affa1; } .log .bad { color:#ff7a7a; } .log .run { color:#9bb0ff; }
  .result { margin-top:16px; display:none; }
  .result iframe { width:100%; height:520px; border:1px solid var(--line); border-radius:14px; background:#fff; }
  .result .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0; }
  .count { font-size:12.5px; color:var(--sub); }
  .warn { margin-top:10px; font-size:12.5px; color:#92400e; background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:8px 12px; display:none; }
  @media (max-width:600px){ .result iframe{height:380px} .wrap{padding:10px 10px 50px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">cover<b>fo</b> <small>3D ORCHESTRATOR ENGINE™ v4.1</small></div>
    <div class="env" id="env"></div>
    <a class="home" href="/">← 홈으로</a>
  </header>

  <div class="card">
    <textarea id="prompt" placeholder="무엇을 만들까요? 예) 트로이 전장에서 싸우는 아킬레우스 3D 게임"></textarea>
    <div class="row">
      <button class="btn primary" id="run">▶ 7단계 엔진 실행</button>
      <button class="btn" id="stop" disabled>■ 중지</button>
      <label class="chk"><input type="checkbox" id="force3d"> 3D 단계(Tripo) 강제 포함</label>
      <label class="chk"><input type="checkbox" id="autogo" checked> 완성되면 결과 화면으로 자동 이동</label>
      <span class="note" id="cost">1회 예상 비용 약 $0.3~1.0 (영상 포함)</span>
    </div>
    <div class="warn" id="warn"></div>
  </div>

  <div class="grid" id="stages"></div>

  <div class="log" id="log"></div>

  <div class="card" id="history" style="margin-top:14px">
    <div class="bar" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <strong style="font-size:14px">📂 작업 내역</strong>
      <span class="count">이 브라우저에 최근 20건 저장 · 채팅으로 보낸 결과는 왼쪽 사이드바 "내 대화"에도 남습니다</span>
      <span style="margin-left:auto"></span>
      <button class="btn" id="clearHist">내역 비우기</button>
    </div>
    <div id="histList" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>

  <div class="result card" id="result">
    <div class="bar">
      <strong style="font-size:14px">7단계 결과 미리보기</strong>
      <span class="count" id="count"></span>
      <span style="margin-left:auto"></span>
      <button class="btn green" id="goChat">👀 결과 화면으로 보내기 (채팅 워크벤치)</button>
      <button class="btn" id="copy">HTML 복사</button>
      <button class="btn" id="cancelGo">자동 이동 취소</button>
    </div>
    <iframe id="frame" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
</div>

<script>
(function () {
  /* ───────── 설정 ───────── */
  var STAGES = [
    { n: 1, key: 'stage1', name: 'Fable 5.1', role: '설계 확장 (spec)', api: '/api/stage1-fable' },
    { n: 2, key: 'stage2', name: 'Astra 6', role: '에셋·디자인 조사', api: '/api/stage2-astra' },
    { n: 3, key: 'stage3', name: 'Gemini 3 Flash Image', role: '사진급 이미지', api: '/api/stage3-gemini' },
    { n: 4, key: 'stage4', name: 'gpt image 2', role: '질감·조명 보정', api: '/api/stage4-gptimage' },
    { n: 5, key: 'stage5', name: 'Veo 3.1', role: '4초 영상', api: '/api/stage5-veo' },
    { n: 6, key: 'stage6', name: 'Tripo3D', role: '이미지 → 3D 모델', api: '/api/stage6-tripo' },
    { n: 7, key: 'stage7', name: 'Opus 4.5', role: '최종 코딩 (index.html)', api: '/api/stage7-opus' }
  ];
  var IS3D = /3d|삼디|입체|three\.?js|glb|3D모델|3d모델/i;
  var $ = function (id) { return document.getElementById(id); };
  var models = {};
  var running = false, aborted = false, ctrl = null, goTimer = null;
  var finalHtml = '', finalTitle = '';

  /* ───────── 로그 ───────── */
  function log(kind, msg) {
    var box = $('log'), line = document.createElement('div');
    var t = new Date().toTimeString().slice(0, 8);
    line.innerHTML = '<span class="t">' + t + '</span><span class="' + kind + '">' + esc(msg) + '</span>';
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  /* ───────── 로그인 토큰 (홈에서 로그인한 Supabase 세션) ───────── */
  function token() {
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') > 0) {
          var v = JSON.parse(localStorage.getItem(k) || 'null');
          if (v && v.access_token) return v.access_token;
        }
      }
    } catch (e) {}
    return null;
  }
  function headers() {
    var h = { 'Content-Type': 'application/json' };
    var t = token();
    if (t) h['Authorization'] = 'Bearer ' + t;
    return h;
  }
  function post(url, body) {
    return fetch(url, { method: 'POST', headers: headers(), body: JSON.stringify(body || {}), signal: ctrl.signal })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
  }
  function get(url) {
    return fetch(url, { headers: headers(), signal: ctrl.signal })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
  }
  function sleep(ms) { return new Promise(function (res, rej) { var t = setTimeout(res, ms); ctrl.signal.addEventListener('abort', function () { clearTimeout(t); rej(new Error('중지됨')); }); }); }

  /* ───────── 단계 카드 ───────── */
  function renderStages() {
    var g = $('stages'); g.innerHTML = '';
    STAGES.forEach(function (s) {
      var d = document.createElement('div');
      d.className = 'st'; d.id = 'st' + s.n;
      d.innerHTML = '<div class="num">STAGE ' + s.n + '</div><div class="name">' + s.name + '</div>' +
        '<div class="model" id="m' + s.n + '">' + (models[s.key] || '') + '</div>' +
        '<div style="font-size:12px;color:#6b6b6b;margin-top:2px">' + s.role + '</div>' +
        '<span class="pill" id="p' + s.n + '">대기</span><div class="time" id="t' + s.n + '"></div><div class="out" id="o' + s.n + '"></div>';
      g.appendChild(d);
    });
  }
  function setStage(n, state, label) {
    var el = $('st' + n); el.className = 'st ' + state;
    $('p' + n).textContent = label;
  }
  function setTime(n, ms) { $('t' + n).textContent = ms != null ? (ms / 1000).toFixed(1) + '초' : ''; }
  function out(n, html) { $('o' + n).innerHTML = html; }

  /* ───────── 환경변수 확인 ───────── */
  fetch('/api/env-check').then(function (r) { return r.json(); }).then(function (j) {
    models = j.models || {};
    renderStages();
    var keys = ['ANTHROPIC_API_KEY', 'GOOGLE_GENERATIVE_AI_API_KEY', 'OPENAI_API_KEY', 'TRIPO_API_KEY'];
    var box = $('env'); box.innerHTML = '';
    keys.forEach(function (k) {
      var s = document.createElement('span'); s.className = j[k] ? 'on' : 'off';
      s.textContent = k.replace('_API_KEY', '').replace('GOOGLE_GENERATIVE_AI', 'GOOGLE') + (j[k] ? ' ✓' : ' ✗');
      box.appendChild(s);
    });
    var a = document.createElement('span'); a.textContent = j.auth === 'login-required' ? '로그인 검사 켜짐' : '로그인 검사 꺼짐'; box.appendChild(a);
    var px = document.createElement('span'); px.className = (j.proxy && j.proxy.indexOf('on') === 0) ? 'on' : 'off';
    px.textContent = '지역차단 우회 중계 ' + (j.proxy || '?'); px.title = 'Supabase Edge Function(google-proxy · anthropic-relay) 경유 여부'; box.appendChild(px);
    var needLogin = (j.auth === 'login-required' && !token());
    if (needLogin) {
      $('warn').style.display = 'block';
      $('warn').innerHTML = '로그인이 필요합니다. <a href="/">홈</a>에서 로그인한 뒤 다시 열어 주세요.';
    }
    log('ok', '엔진 준비됨 — ' + (j.version || ''));
    /* 홈에서 넘어온 경우(?prompt=) → 버튼을 누르지 않아도 바로 실행 */
    if (autoRun && !needLogin && $('prompt').value.trim()) {
      autoRun = false;
      log('run', '홈 화면에서 넘어옴 — 자동 실행합니다');
      setTimeout(run, 300);
    }
  }).catch(function () { renderStages(); log('bad', '/api/env-check 를 불러오지 못했습니다 (배포 확인 필요)'); });

  /* ───────── 주소의 ?prompt= 자동 입력 + 자동 실행 표시 ───────── */
  var autoRun = false;
  try {
    var sp = new URLSearchParams(location.search);
    var qp = sp.get('prompt');
    if (qp) { $('prompt').value = qp; autoRun = sp.get('auto') !== '0'; }
  } catch (e) {}

  /* ───────── 이미지 줄이기 (워크벤치에 넣을 때 파일이 너무 커지지 않게) ───────── */
  function shrink(dataUrl, maxW) {
    return new Promise(function (res) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = function () { res(dataUrl); };
      img.src = dataUrl;
    });
  }

  /* ───────── 실행 ───────── */
  async function run() {
    var prompt = $('prompt').value.trim();
    if (!prompt || running) return;
    running = true; aborted = false; ctrl = new AbortController();
    finalHtml = ''; finalTitle = '';
    $('run').disabled = true; $('stop').disabled = false; $('result').style.display = 'none';
    if (goTimer) { clearInterval(goTimer); goTimer = null; }
    STAGES.forEach(function (s) { setStage(s.n, '', '대기'); setTime(s.n, null); out(s.n, ''); });

    var is3D = $('force3d').checked || IS3D.test(prompt);
    var spec = null, research = null, img1 = null, img1Mime = 'image/png', img2 = null, videoUrl = null, modelUrl = null;
    log('run', '🚀 7단계 실행 시작 — "' + prompt.slice(0, 60) + '"' + (is3D ? ' (3D 포함)' : ''));

    async function stage(n, fn) {
      if (aborted) return;
      var st = Date.now();
      setStage(n, 'run', '진행 중');
      try {
        await fn();
        if ($('p' + n).textContent === '진행 중') setStage(n, 'ok', '완료');
      } catch (e) {
        if (aborted) { setStage(n, 'skip', '중지'); throw e; }
        setStage(n, 'bad', '실패');
        out(n, '<pre>' + esc(e.message || e) + '</pre>');
        log('bad', '✗ ' + n + '단계 실패: ' + (e.message || e) + ' — 다음 단계로 넘어갑니다');
      } finally { setTime(n, Date.now() - st); }
    }

    try {
      await stage(1, async function () {
        var j = await post('/api/stage1-fable', { prompt: prompt });
        spec = j.spec; finalTitle = (spec && spec.title) || prompt.slice(0, 40);
        out(1, '<pre>' + esc(JSON.stringify(spec, null, 1).slice(0, 1200)) + '</pre>');
        log('ok', '✓ 1단계 설계 완료 (' + j.model + ')');
      });
      await stage(2, async function () {
        var j = await post('/api/stage2-astra', { spec: spec });
        research = j.research;
        out(2, '<pre>' + esc(JSON.stringify(research, null, 1).slice(0, 800)) + '</pre>');
        log('ok', '✓ 2단계 조사 완료 (' + j.model + ')');
      });
      var pImg = (spec && spec.promptForImage) || prompt;
      await stage(3, async function () {
        var j = await post('/api/stage3-gemini', { promptForImage: pImg });
        img1 = j.imageBase64; img1Mime = j.mimeType || 'image/png';
        out(3, '<img src="data:' + img1Mime + ';base64,' + img1 + '">');
        log('ok', '✓ 3단계 이미지 완료 (' + j.model + ')');
      });
      await stage(4, async function () {
        var j = await post('/api/stage4-gptimage', { styleGuide: spec && spec.styleGuide, promptForImage: pImg });
        img2 = j.imageBase64;
        if (img2) out(4, '<img src="data:image/png;base64,' + img2 + '">');
        log('ok', '✓ 4단계 이미지 완료 (' + j.model + ')');
      });
      await stage(5, async function () {
        var j = await post('/api/stage5-veo', { promptForVideo: spec && spec.promptForVideo, promptForImage: pImg, imageBase64: img1, mimeType: img1Mime });
        log('run', '… 5단계 영상 만드는 중 (보통 1~3분): ' + j.operationName);
        out(5, '<pre>영상 생성 중… 기다려 주세요</pre>');
        var deadline = Date.now() + 240000;
        while (Date.now() < deadline) {
          await sleep(8000);
          var s = await get('/api/stage5-veo-status?name=' + encodeURIComponent(j.operationName));
          if (s.error) throw new Error(JSON.stringify(s.error).slice(0, 300));
          if (s.done && s.videoUri) {
            videoUrl = location.origin + '/api/stage5-veo-status?file=' + encodeURIComponent(s.videoUri);
            out(5, '<video src="' + videoUrl + '" controls muted playsinline></video>');
            log('ok', '✓ 5단계 영상 완료');
            return;
          }
          if (s.done) throw new Error('영상이 돌아오지 않았습니다');
          out(5, '<pre>영상 생성 중… ' + Math.round((deadline - Date.now()) / 1000) + '초 더 기다립니다</pre>');
        }
        throw new Error('4분 안에 끝나지 않아 영상 없이 진행합니다');
      });
      await stage(6, async function () {
        var j = await post('/api/stage6-tripo', { imageBase64: img1, is3D: is3D });
        if (j.skipped) { setStage(6, 'skip', '건너뜀'); out(6, '<pre>' + esc(j.reason) + '</pre>'); log('ok', '⊘ 6단계 건너뜀: ' + j.reason); return; }
        log('run', '… 6단계 3D 모델 만드는 중: ' + j.taskId);
        var deadline = Date.now() + 240000;
        while (Date.now() < deadline) {
          await sleep(6000);
          var s = await get('/api/stage6-tripo-status?taskId=' + encodeURIComponent(j.taskId));
          if (s.status === 'success' && s.modelUrl) { modelUrl = s.modelUrl; out(6, '<a href="' + esc(modelUrl) + '" target="_blank">GLB 모델 열기</a>'); log('ok', '✓ 6단계 3D 모델 완료'); return; }
          if (s.status === 'failed' || s.status === 'cancelled' || s.status === 'unknown') throw new Error('Tripo 상태: ' + s.status);
          out(6, '<pre>3D 모델 생성 중… ' + (s.progress != null ? s.progress + '%' : '') + '</pre>');
        }
        throw new Error('4분 안에 끝나지 않아 3D 모델 없이 진행합니다');
      });
      await stage(7, async function () {
        // 7단계는 글자를 받는 대로 흘려보내는 스트림입니다 (한 번에 받으면 60초 넘어 연결이 끊김 — 실측)
        var r = await fetch('/api/stage7-opus', { method: 'POST', headers: headers(), signal: ctrl.signal,
          body: JSON.stringify({ prompt: prompt, spec: spec, research: research, assets: { image1: !!img1, image2: !!img2, video: !!videoUrl, model: !!modelUrl } }) });
        var ct = r.headers.get('content-type') || '';
        if (!r.ok || ct.indexOf('application/json') >= 0) {
          var ej = await r.json().catch(function () { return {}; });
          throw new Error(ej.error || ('HTTP ' + r.status));
        }
        var reader = r.body.getReader(), dec = new TextDecoder(), html = '', lastTick = 0;
        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;
          html += dec.decode(chunk.value, { stream: true });
          if (Date.now() - lastTick > 700) { lastTick = Date.now(); out(7, '<pre>코드 받는 중… ' + html.length + '자</pre>'); }
        }
        html += dec.decode();
        var em = html.match(/<!--CF_ERROR:([\s\S]*?)-->/);
        if (em) throw new Error(em[1]);
        html = html.trim().replace(/^```html\s*\n?/, '').replace(/^```\s*\n?/, '').replace(/\n```\s*$/, '');
        if (!/<html[\s>]/i.test(html)) throw new Error('HTML 이 돌아오지 않았습니다 (' + html.length + '자)');
        var j = { model: (models.stage7 || 'opus') };
        // 자리표시자를 실제 데이터로 바꿔 끼움 (이미지는 줄여서)
        if (img1 && html.indexOf('{{IMAGE_1}}') >= 0) html = html.split('{{IMAGE_1}}').join(await shrink('data:' + img1Mime + ';base64,' + img1, 768));
        if (img2 && html.indexOf('{{IMAGE_2}}') >= 0) html = html.split('{{IMAGE_2}}').join(await shrink('data:image/png;base64,' + img2, 768));
        if (videoUrl) html = html.split('{{VIDEO_URL}}').join(videoUrl);
        if (modelUrl) html = html.split('{{MODEL_URL}}').join(modelUrl);
        html = html.replace(/\{\{(IMAGE_1|IMAGE_2|VIDEO_URL|MODEL_URL)\}\}/g, '');
        finalHtml = html;
        out(7, '<pre>' + esc(html.slice(0, 600)) + '…</pre>');
        log('ok', '✓ 7단계 코드 완료 (' + j.model + ', ' + html.length + '자)');
        showResult();
      });
    } catch (e) {
      log('bad', '중지: ' + (e.message || e));
    }
    running = false; $('run').disabled = false; $('stop').disabled = true;
    if (!aborted) log('ok', '🎉 실행 끝');
    // 작업 내역에 남깁니다 (단계별 결과 요약 + 완성 HTML)
    var summary = STAGES.map(function (s) { return s.n + ':' + ($('p' + s.n).textContent || '').replace('진행 중', '중단'); }).join(' ');
    saveHist({ at: Date.now(), prompt: prompt, title: finalTitle || prompt.slice(0, 40), ok: !!finalHtml, size: finalHtml.length, html: finalHtml, stages: summary });
  }

  /* ───────── 작업 내역 (localStorage, 최근 20건) ───────── */
  var HKEY = 'cf-engine-history';
  function readHist() { try { var v = JSON.parse(localStorage.getItem(HKEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function writeHist(list) { try { localStorage.setItem(HKEY, JSON.stringify(list.slice(0, 20))); } catch (e) { log('bad', '작업 내역 저장 실패 (저장 공간 부족) — 오래된 항목을 지워 주세요'); } }
  function saveHist(entry) { var list = readHist(); list.unshift(entry); writeHist(list); renderHist(); }
  function renderHist() {
    var box = $('histList'); box.innerHTML = '';
    var list = readHist();
    if (!list.length) { box.innerHTML = '<div style="font-size:12.5px;color:#6b6b6b;padding:6px 2px">아직 작업 내역이 없습니다.</div>'; return; }
    list.forEach(function (h, i) {
      var d = document.createElement('div');
      d.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid rgba(0,0,0,.07);border-radius:10px;background:#fff;font-size:12.5px';
      var when = new Date(h.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      d.innerHTML = '<span style="color:#6b6b6b;flex:none">' + esc(when) + '</span>' +
        '<span style="flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(h.prompt) + '">' + esc(h.title || h.prompt) + '</span>' +
        '<span style="flex:none;color:' + (h.ok ? '#047857' : '#b91c1c') + '">' + (h.ok ? '완성 ' + Math.round(h.size / 1000) + 'KB' : '미완성') + '</span>' +
        (h.stages ? '<span style="flex:none;color:#6b6b6b" title="단계별 결과">' + esc(h.stages) + '</span>' : '');
      if (h.ok) {
        var b1 = document.createElement('button'); b1.className = 'btn'; b1.style.height = '30px'; b1.textContent = '다시 보기';
        b1.addEventListener('click', function () { finalHtml = h.html; finalTitle = h.title; $('prompt').value = h.prompt || ''; $('result').style.display = 'block'; $('frame').srcdoc = h.html; $('count').textContent = '작업 내역에서 불러옴'; $('result').scrollIntoView({ behavior: 'smooth' }); });
        var b2 = document.createElement('button'); b2.className = 'btn green'; b2.style.height = '30px'; b2.textContent = '채팅으로';
        b2.addEventListener('click', function () { finalHtml = h.html; finalTitle = h.title; $('prompt').value = h.prompt || ''; goChat(); });
        d.appendChild(b1); d.appendChild(b2);
      }
      var b3 = document.createElement('button'); b3.className = 'btn'; b3.style.height = '30px'; b3.textContent = '삭제';
      b3.addEventListener('click', function () { var l = readHist(); l.splice(i, 1); writeHist(l); renderHist(); });
      d.appendChild(b3);
      box.appendChild(d);
    });
  }
  $('clearHist').addEventListener('click', function () { if (confirm('작업 내역을 모두 지울까요?')) { writeHist([]); renderHist(); } });
  renderHist();

  function showResult() {
    $('result').style.display = 'block';
    $('frame').srcdoc = finalHtml;
    $('result').scrollIntoView({ behavior: 'smooth' });
    if ($('autogo').checked) {
      var left = 5;
      $('count').textContent = left + '초 뒤 결과 화면으로 이동합니다';
      goTimer = setInterval(function () {
        left--; $('count').textContent = left + '초 뒤 결과 화면으로 이동합니다';
        if (left <= 0) { clearInterval(goTimer); goTimer = null; goChat(); }
      }, 1000);
    }
  }
  function goChat() {
    if (!finalHtml) return;
    try {
      sessionStorage.setItem('cf-engine-result', JSON.stringify({ title: finalTitle || '엔진 결과', html: finalHtml, prompt: $('prompt').value.trim() }));
    } catch (e) { alert('결과가 너무 커서 넘기지 못했습니다. HTML 복사를 이용해 주세요.'); return; }
    location.href = '/chat?engine=1';
  }

  $('run').addEventListener('click', run);
  $('stop').addEventListener('click', function () { if (!running) return; aborted = true; ctrl.abort(); });
  $('goChat').addEventListener('click', function () { if (goTimer) { clearInterval(goTimer); goTimer = null; } goChat(); });
  $('cancelGo').addEventListener('click', function () { if (goTimer) { clearInterval(goTimer); goTimer = null; } $('count').textContent = '자동 이동을 취소했습니다'; });
  $('copy').addEventListener('click', function () { navigator.clipboard.writeText(finalHtml).then(function () { log('ok', 'HTML 을 복사했습니다'); }); });
  $('prompt').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run(); });
  renderStages();
})();
</script>
</body>
</html>
