  var GRAPE='<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 14 C 62 10, 68 8, 72 12 C 76 16, 74 24, 60 26 C 46 24, 44 16, 48 12 C 52 8, 58 10, 60 14 Z" fill="#2ECC71"/><circle cx="46" cy="70" r="26" fill="#8B5CF6" stroke="#6D28D9" stroke-width="3"/><circle cx="76" cy="70" r="26" fill="#A78BFA" stroke="#6D28D9" stroke-width="3"/></svg>';

    var h=$("rhint"); if(h) h.textContent=S.len+"초 영상은 "+S.len+"초쯤 걸려요. 화면을 켜 둔 채 기다려 주세요 (다른 앱으로 가면 멈출 수 있어요).";
    var vs=cv.captureStream(30), AC2=window.AudioContext||window.webkitAudioContext, ac=null, tracks=vs.getVideoTracks();
    if(AC2&&S.music!=="none"){ try{ ac=new AC2(); var dst=ac.createMediaStreamDestination(); var t0=ac.currentTime+.12; music(ac,master(ac,dst,t0,S.len),S.music,t0,S.len); tracks=tracks.concat(dst.stream.getAudioTracks()); }catch(e){ ac=null; } }
    var ms=new MediaStream(tracks), chunks=[], rec;
    try{ rec=new MediaRecorder(ms,{mimeType:mime,videoBitsPerSecond:5000000,audioBitsPerSecond:128000}); }catch(e){ try{ rec=new MediaRecorder(ms); mime=rec.mimeType||mime; }catch(e2){ msg("영상을 만들지 못했어요"); if(ac) ac.close(); return; } }
    var stopped=false, raf=0, start=0;
    REC={stop:function(cancel){ if(stopped) return; stopped=true; cancelAnimationFrame(raf); REC.cancel=!!cancel; try{ rec.stop(); }catch(e){} if(ac){ try{ ac.close(); }catch(e){} } }};
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      var cancel=REC&&REC.cancel; REC=null;
      if(cancel){ go(3); return; }
      finish(new Blob(chunks,{type:(mime.split(";")[0])||"video/webm"}),P);
    };
    var loop=function(){
      var t=(performance.now()-start)/1000;
      frame(ctx,P,Math.min(t,S.len-.001));
      var l=$("recl"), b=$("rb"); if(l) l.textContent="● 만드는 중 "+Math.min(S.len,Math.floor(t))+" / "+S.len+"초"; if(b) b.style.width=Math.min(100,t/S.len*100)+"%";
      if(t>=S.len+.15){ REC&&REC.stop(false); return; }
      raf=requestAnimationFrame(loop);
    };
    frame(ctx,P,0);
    rec.start(500); start=performance.now(); raf=requestAnimationFrame(loop);
  }
  function step4(){
    if(!S.url){ go(S.photos.length?3:1); return; }
    var st=STY[S.style]||STY.vlog, mu=MUS[S.music]||MUS.none;
    var h='<div class="eb">STEP 4 · 쇼츠 미리보기</div><div class="h2">'+(S.fromList?esc(S.title):'이대로<br>공유할까요?')+'</div><div class="vid"><video id="vd" src="'+S.url+'" controls playsinline loop preload="metadata"'+(S.thumb?' poster="'+S.thumb+'"':'')+'></video><span class="rec">'+S.len+'초 · '+esc(st.n)+'</span></div>'
      +(S.fromList||!S.photos.length?'<div class="acts3" style="grid-template-columns:1fr 1fr"><button type="button" data-a="new">＋ 새 쇼츠 만들기</button><button type="button" data-del="'+esc(S.saved)+'">🗑 이 쇼츠 삭제</button></div>':'<div class="acts3"><button type="button" data-a="render">↻ 다시 만들기</button><button type="button" data-a="tomusic">♪ 음악 바꾸기</button><button type="button" data-a="totitle">T 자막 편집</button></div>')
      +(S.keptMsg&&!S.fromList?'<p class="msg ok" style="margin:4px 0 0">'+S.keptMsg+'</p>':'')
      +'<p class="note" style="text-align:center">♪ '+esc(mu.n)+' · '+S.len+'초 · '+(S.ext==="mp4"?"mp4 영상":"webm 영상")+' · '+(S.blob.size/1048576).toFixed(1)+'MB'+(S.ext==="webm"?'<br>이 브라우저는 webm 으로만 만들어요. 인스타·카톡에 안 올라가면 크롬 최신 버전이나 아이폰 사파리에서 만들어 주세요.':'')+'</p><div class="msg" id="msg" role="status"></div>';
    $("main").innerHTML=h;
    cta('<button type="button" class="go" data-a="to5">이 쇼츠로 공유하기</button>');
  }

  /* ── ⑤ 공유하기 ── */
  var CH=[["reels","인스타 릴스","◎","#FFE4EF","#E1306C"],["tiktok","틱톡","♪","#F1F1F4","#111"],["yt","유튜브 쇼츠","▶","#FFE6E6","#FF0000"],["kakao","카톡","💬","#FFF6C7","#3C1E1E"],["feed","coverfo 피드","","#F0EBFF","#7C4DFF"]];
  /* v472: 함께 보내는 글은 "나도 만들기 + 주소" 한 줄만 (사용자 요청 · 해시태그 없음 → 카톡 # 검색 링크 문제도 없음) */
  function caption(){ return S.link?"🎬 나도 만들기 👉 https://coverfo.com/shorts/":""; }
  function step5(){
    if(!S.url){ go(3); return; }
    var h='<div class="eb">STEP 5 · 공유하기</div><div class="h2">친구에게<br>자랑해볼까요?</div><div class="ch">'+CH.map(function(c){ return '<button type="button" data-ch="'+c[0]+'" aria-pressed="'+!!S.ch[c[0]]+'"><span class="i" style="background:'+c[3]+';color:'+c[4]+'">'+(c[0]==="feed"?'<span style="width:28px;height:28px;display:block">'+GRAPE+'</span>':c[2])+'</span>'+c[1]+'<small>✓ 선택됨</small></button>'; }).join("")+'</div>';
    h+='<div class="card"><div class="capbar"><b>함께 보내는 글</b><button type="button" data-a="copy">⧉ 복사</button></div><div class="cap" id="capt">'+esc(caption()||"(글 없이 영상만 보내요)")+'</div><p class="note">영상을 보낼 때 이 글도 함께 보내요. 공유 버튼을 누르면 이 글이 복사돼요 — 카톡에 글이 안 붙어 가면 대화창을 길게 눌러 붙여넣기 하세요.</p></div>';
    h+='<div class="card swr"><span class="t"><b>링크 포함</b><small>친구가 링크를 누르면 여행 자동 쇼츠가 바로 열려요</small></span><button type="button" class="sw" role="switch" aria-checked="'+S.link+'" data-link="1" aria-label="링크 포함"></button></div>';
    if(S.ch.feed) h+='<div class="card"><div class="sec">🍇 coverfo 피드 (누리트립 쇼츠)</div><input class="tin" id="fplace" maxlength="40" placeholder="어디 여행이었나요? (예: 제주 협재해변)" value="'+esc((cur()&&cur().place&&cur().place.name)||(cur()&&cur().title)||"")+'" aria-label="장소"><p class="note">누리트립 쇼츠로 올리면 1크레딧이에요 (기존 쇼츠 올리기와 같아요). 누리트립 닉네임이 있어야 올릴 수 있어요.</p></div>';
    h+='<div class="msg" id="msg" role="status"></div><p class="note" style="text-align:center">휴대폰 공유창이 열리면 고른 앱(릴스·틱톡·유튜브·카톡)을 누르세요. 실제 전송은 그 앱에서 이어져요.</p>';
    $("main").innerHTML=h;
    cta('<button type="button" class="go" data-a="share">⤴ 공유하고 여행 기록 저장</button><button type="button" class="sub2" data-a="save">📥 휴대폰에 저장</button>');
  }
  function fileOf(){ return new File([S.blob],"coverfo-shorts."+S.ext,{type:S.mime}); }
  function save(){
    var a=document.createElement("a"); a.href=S.url; a.download="coverfo-shorts."+S.ext; document.body.appendChild(a); a.click(); a.remove();
    msg(window.CoverfoApp?"저장이 안 되면 크롬에서 coverfo.com 을 열어 만들어 주세요.":"✓ 휴대폰에 저장했어요 (다운로드 폴더)",!window.CoverfoApp);
  }
  function copy(text){ try{ navigator.clipboard.writeText(text).then(function(){ msg("✓ 문구를 복사했어요",true); },function(){ window.prompt("아래 문구를 복사하세요",text); }); }catch(e){ window.prompt("아래 문구를 복사하세요",text); } }
  function upFeed(){
    var place=(($("fplace")||{}).value||"").trim();
    if(!place){ msg("어디 여행이었는지 적어 주세요"); return Promise.resolve(false); }
    if(!auth()){ msg("coverfo 피드에 올리려면 로그인해 주세요"); return Promise.resolve(false); }
    msg("coverfo 피드에 올리는 중…",true);
    var tok=auth();
    var put=function(type,blob,ct){ return fetch("/api/trip?op=upload&type="+type,{method:"PUT",headers:{Authorization:"Bearer "+tok,"Content-Type":ct},body:blob}).then(function(r){ return r.json().then(function(j){ j.status=r.status; return j; }); }); };
    var thumbBlob=S.thumb?fetch(S.thumb).then(function(r){ return r.blob(); }):Promise.resolve(null);
    return put("video",S.blob,S.mime).then(function(v){
      if(!v.ok){ throw new Error(v.profile?"누리트립 닉네임을 먼저 만들어 주세요 (누리트립 → 내 글)":v.need?"크레딧이 부족해요 (1크레딧 필요)":v.error||"올리지 못했어요"); }
      return thumbBlob.then(function(tb){ return tb?put("thumb",tb,"image/jpeg").catch(function(){ return {}; }):{}; }).then(function(th){
        var pl=(cur()&&cur().place)||{};
        return tripApi("POST","",{op:"create",kind:"shorts",media:[{u:v.u,thumb:th&&th.u||"",dur:S.dur}],body:S.title,place:{name:place,addr:pl.addr||"",lat:pl.lat,lng:pl.lng}});
      });
    }).then(function(j){
      if(!j.ok) throw new Error(j.need?"크레딧이 부족해요 (1크레딧 필요)":j.error||"올리지 못했어요");
      msg("✓ coverfo 피드(누리트립 쇼츠)에 올렸어요 · 1크레딧",true); S.ch.feed=false; S.fed=true; return true;
    }).catch(function(e){ msg(e.message||"올리지 못했어요"); return false; });
  }
  function share(btn){
    btn.disabled=true;
    var ext=S.ch.reels||S.ch.tiktok||S.ch.yt||S.ch.kakao, text=caption();
    if(ext&&text){ try{ navigator.clipboard.writeText(text).catch(function(){}); }catch(e){} }
    var p=S.ch.feed?upFeed():Promise.resolve(true);
    p.then(function(okFeed){
      btn.disabled=false;
      if(!ext) return;
      var f=fileOf();
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        navigator.share(text?{files:[f],text:text}:{files:[f]}).then(function(){ msg("✓ 공유했어요",true); },function(e){ if(e&&e.name!=="AbortError") msg("공유하지 못했어요. 📥 휴대폰에 저장한 뒤 앱에서 올려 주세요."); });
      } else {
        save(); if(text) copy(text);
        msg((okFeed&&S.fed?"✓ coverfo 피드에 올렸어요 · ":"")+"이 브라우저는 영상 바로 공유를 지원하지 않아요. 휴대폰에 저장하고 문구를 복사했어요 — 고른 앱에서 영상을 올리고 붙여넣기 하세요.");
      }
    });
  }

  /* ── 누르기 ── */
  document.addEventListener("click",function(e){
    var t=e.target&&e.target.closest?e.target:null; if(!t) return;
    var b=t.closest("[data-trip]"); if(b){ var ns=+b.getAttribute("data-trip"); if(ns!==S.sel) S.extra=[]; S.sel=ns; S.title=""; S.photos=[]; step1(); return; }
    b=t.closest("[data-open]"); if(b){ openMine(b.getAttribute("data-open")); return; }
    b=t.closest("[data-del]"); if(b){ delMine(b.getAttribute("data-del")); return; }
    b=t.closest("[data-play]"); if(b){ e.stopPropagation(); preview(b.getAttribute("data-play")); return; }
    b=t.closest("[data-ph]"); if(b&&!S.busy){ var p=S.photos[+b.getAttribute("data-ph")]; if(p){ p.on=!p.on; if(S.step===3){ var y=window.scrollY; step3(); window.scrollTo(0,y); } else drawStep2(100,"편집 준비 끝!"); } return; }
    b=t.closest("[data-sty]"); if(b){ var k=b.getAttribute("data-sty"); S.style=k; S.music=STY[k].m; keepTitle(); step3(); return; }
    b=t.closest("[data-mu]"); if(b){ S.music=b.getAttribute("data-mu"); keepTitle(); step3(); return; }
    b=t.closest("[data-cap]"); if(b){ S.cap=b.getAttribute("data-cap"); keepTitle(); step3(); return; }
    b=t.closest("[data-len]"); if(b){ S.len=+b.getAttribute("data-len"); keepTitle(); var k2=want(), on=S.photos.filter(function(x){ return x.on; }).length; if(on<k2){ S.photos.filter(function(x){ return !x.on; }).sort(function(a,c){ return c.score-a.score; }).slice(0,k2-on).forEach(function(x){ x.on=true; }); } step3(); return; }
    b=t.closest("[data-wm]"); if(b){ S.wm=!S.wm; b.setAttribute("aria-checked",String(S.wm)); return; }
    b=t.closest("[data-link]"); if(b){ S.link=!S.link; b.setAttribute("aria-checked",String(S.link)); var c=$("capt"); if(c) c.textContent=caption()||"(글 없이 영상만 보내요)"; return; }
    b=t.closest("[data-ch]"); if(b){ var ck=b.getAttribute("data-ch"); S.ch[ck]=!S.ch[ck]; step5(); return; }
    b=t.closest("[data-a]"); if(!b) return;
    var a=b.getAttribute("data-a");
    if(a==="auto"){ go(2); return; }
    if(a==="new"){ S.fromList=false; S.saved=""; loadMine().then(function(){ go(1); }); return; }
    if(a==="skip"){ RUN++; analyze(true); return; }
    if(a==="render"){ render(); return; }
    if(a==="cancel"){ if(REC) REC.stop(true); return; }
    if(a==="tomusic"||a==="totitle"){ go(3); setTimeout(function(){ var el=a==="totitle"?$("ttl"):document.querySelector("[data-mu]"); if(el){ el.scrollIntoView({block:"center"}); if(a==="totitle") el.focus(); } },60); return; }
    if(a==="to5"){ var v=$("vd"); if(v) v.pause(); go(5); return; }
    if(a==="copy"){ if(caption()) copy(caption()); else msg("보낼 글이 없어요 (링크 포함이 꺼져 있어요)"); return; }
    if(a==="save"){ save(); return; }
    if(a==="share"){ share(b); return; }
  });
  function keepTitle(){ var t=$("ttl"); if(t) S.title=t.value; }
  document.addEventListener("keydown",function(e){ var m=e.target&&e.target.closest&&e.target.closest("[data-mu]"); if(m&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); m.click(); } });
  document.addEventListener("change",function(e){
    if(e.target&&e.target.id==="files"){
      var fs=[].slice.call(e.target.files||[]).filter(function(f){ return /^image\//.test(f.type)||/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name); }).slice(0,40);
      fs.sort(function(a,b){ return a.lastModified-b.lastModified; });
      S.local=fs.map(function(f,i){ return {file:f,cap:"",t:f.lastModified||i,th:URL.createObjectURL(f)}; }); S.sel=-2; S.title=""; S.photos=[];
      step1(); if(fs.length===1) msg("사진을 2장 이상 골라 주세요");
    }
    if(e.target&&e.target.id==="morep"){
      var more=[].slice.call(e.target.files||[]).filter(function(f){ return /^image\//.test(f.type)||/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name); }).slice(0,40);
      var t0=S.trips[S.sel], cap=t0&&t0.places[0]||"";
      S.extra=S.extra.concat(more.map(function(f,i){ return {file:f,cap:cap,t:(f.lastModified||0)+i,th:URL.createObjectURL(f)}; })).slice(0,40); S.photos=[];
      step1();
    }
  });
  document.addEventListener("visibilitychange",function(){ if(document.hidden&&REC&&!REC.wc){ REC.stop(true); setTimeout(function(){ msg("다른 화면으로 가서 만들기를 멈췄어요. 다시 눌러 주세요."); },300); } });
  function openMine(id){
    if(!window.cfShorts) return;
    cfShorts.get(id).then(function(r){
      if(!r||!r.blob){ step1(); msg("이 쇼츠를 찾지 못했어요 (다른 휴대폰·브라우저에서 만든 쇼츠는 여기 없어요)"); return; }
      if(S.url) URL.revokeObjectURL(S.url);
      S.blob=r.blob; S.url=URL.createObjectURL(r.blob); S.mime=r.mime||r.blob.type||"video/mp4"; S.ext=r.ext||(/mp4/.test(S.mime)?"mp4":"webm");
      S.len=r.len||S.len; S.dur=S.len; S.title=r.title||""; S.thumb=r.thumb||""; S.style=r.style||S.style; S.music=r.music||S.music; S.saved=r.id; S.fromList=true; S.keptMsg="";
      go(4);
    });
  }
  function delMine(id){
    if(!window.cfShorts||!id) return;
    if(!window.confirm("이 쇼츠를 이 휴대폰에서 지울까요? 지우면 되돌릴 수 없어요.")) return;
    cfShorts.del(id).then(function(){
      if(S.saved===id){ S.saved=""; if(S.fromList){ S.fromList=false; if(S.url) URL.revokeObjectURL(S.url); S.url=""; S.blob=null; } }
      return loadMine();
    }).then(function(){ if(S.step===1||!S.url) go(1); else msg("✓ 지웠어요",true); });
  }
  drawSteps();
  var qv=/[?&]v=([\w-]{4,40})/.exec(location.search);
  Promise.all([loadTrips().catch(function(){}),loadMine()]).then(function(){
    if(S.trips.length&&S.sel===-1) S.sel=0;
    if(qv){ try{ history.replaceState(null,"",location.pathname); }catch(e){} openMine(qv[1]); return; }
    step1();
  });
})();
