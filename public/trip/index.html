<title>누리트립 — coverfo</title>
<!-- coverfo 📸 누리트립 (여행 사진·쇼츠 커뮤니티) 1단계 · v427
     · 보기: 🎬 쇼츠(세로로 넘기기) · 🖼 사진(카드) · 📌 저장 · 🙋 내 글 — 정렬: 최신 · 저장 많은 · 가까운
     · 올리기: 사진 10장(무료) 또는 쇼츠 1개(30초 · 50MB · v428: 1크레딧) + 장소(필수 · 네이버 지역 검색) + 다녀온 날짜 + 한 줄 후기 + 태그
     · 사진은 폰에서 줄이며 위치정보(EXIF)를 지우고, 쇼츠는 영상 속 위치 기록을 지운 뒤 올린다.
     · 글 아래 장소 버튼: 길안내(카카오맵) · 숙소(Hotels.com) · 항공 · 렌터카(익스피디아) — 기존 제휴 링크
     · 신고(3번이면 숨김) · 차단 · 내 글 지우기 · 관리자 확인(🛡) · 만 14세 미만은 글쓰기·댓글·반응 못 함
     · 서버: /api/trip · 파일: /media/trip/… (R2) · 주소 /trip/?p=글번호 로 글 바로 열기
     · v429 2단계: 👥 팔로잉(팔로우한 사람의 새 글) · 닉네임 누르면 그 사람의 글 · 🗺 지도(내 글·저장한 글 핀)
       · 테마 지도(글을 골라 묶어 링크 공유, /trip/?m=번호) · 🌐 번역 보기(글·댓글, 기존 /api/trans 마주보기 번역 0.1크레딧)
       · 지도 그림: Leaflet(cdnjs) + OpenStreetMap 공개 타일(출처 표시) · 1:1 대화는 넣지 않음(토스 규정상 채팅 노출 불가)
     · v430 3단계: 🙋 질문방(지역별 묻고 답하기 · 게시판 방식) · 🤖 AI 일정(고른 글로 일정표 · 1크레딧) · 예약 버튼 눌림 수(내 글 · 관리자 🏆)
       · 사진 여러 장이면 아래 동그라미 표시 · 지도 불러오기: cdnjs leaflet.js → 안 되면 unpkg(공식 안내 주소)
     · v431: 글 아래 버튼 = 길안내 · 주차장 · 숙소 · 렌터카 (항공 → 주차장, 카카오맵 검색)
       · 안드로이드 웹(소리 앱 아님)에서 숙소는 크롬으로 열기(Hotels.com 앱으로 넘어가지 않게) · 크롬이 없으면 원래 주소
       · 🤖 AI 일정: 고른 글 + 주변 명소·맛집(카카오 장소 검색)으로 날짜별 코스 · 지도에 날짜 색 번호와 이동 선
     · v432: 해외 코스는 구글 지도(Maps Embed API 경로 지도 · 구글 장소는 구글 지도에만 표시) · AI 결과 아래 버튼 = 길안내 · 주차장 · 숙소 · 렌터카
       (길안내·주차장은 고른 날짜의 첫 장소 기준 · 국내 카카오맵 / 해외 구글 지도 Maps URLs)
     · v433: 🗺 지도 탭 → 🗓 일정짜기 · 지도 칸을 따로 겹(z-index)으로 묶어 뒤 탭 지도가 창 위로 겹쳐 보이던 것 고침
       · 📋 내가 만든 일정: AI 일정을 만들면 자동 저장 → 목록에서 다시 열기·지우기 (해외 구글 장소는 place id 만 저장)
     · v434: 고른 장소에 좌표가 하나도 없으면 "국내/해외"를 물어봄(기본 국내) → 국내는 카카오(번호 지도), 해외는 구글 · 좌표가 있으면 좌표로 판단
     · v435: 탭 2줄 — 윗줄 🖼 사진 · 🎬 쇼츠 · 🗓 일정짜기 · 🗺 테마지도 / 아랫줄 🙋 내 글 · 👥 팔로잉 · 🙋 질문방 (· 🛡 신고)
       · 처음 화면은 사진 · 📌 저장 탭 없앰(📌 저장 단추는 그대로, 저장한 글은 일정짜기·테마지도에서 고름)
       · 테마 지도 만들기·목록은 🗺 테마지도 탭에만 · 질문방은 🇰🇷 국내 / 🌍 해외로 나눔
     · v436 (시험): 안드로이드 웹의 🏨 숙소 → 크롬 intent 대신 coverfo 안내 화면(/trip/go/)을 2.5초 거쳐 Hotels.com 웹으로
     · v437: 요청대로 숙소 열기를 v434 방식(크롬 intent)으로 되돌림 · /trip/go/ 는 더 이상 쓰지 않음 -->
<style>

<script>
(function(){
  "use strict";
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }
  function token(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf("sb-")===0&&k.indexOf("-auth-token")>0){ var v=JSON.parse(localStorage.getItem(k)||"null"); var t=v&&(v.access_token||(v.currentSession&&v.currentSession.access_token)); if(t) return t; } } }catch(e){} return ""; }
  function api(method,q,body){
    var h={}; var t=token(); if(t) h.Authorization="Bearer "+t;
    var o={method:method,headers:h,cache:"no-store"};
    if(body!==undefined){ h["Content-Type"]="application/json"; o.body=JSON.stringify(body); }
    return fetch("/api/trip"+(q||""),o).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ j._s=r.status; return j; }); })["catch"](function(){ return {error:"연결이 끊겼어요. 다시 해 주세요.",_s:0}; });
  }
  function say(t,ok){ $("msg").innerHTML=t?'<div class="msg'+(ok?" ok":"")+'">'+t+'</div>':""; }
  function ago(iso){ var d=(Date.now()-Date.parse(iso))/1000; if(!(d>=0)) return ""; if(d<60) return "방금"; if(d<3600) return Math.floor(d/60)+"분 전"; if(d<86400) return Math.floor(d/3600)+"시간 전"; if(d<86400*30) return Math.floor(d/86400)+"일 전"; var t=new Date(iso); return t.getFullYear()+"."+(t.getMonth()+1)+"."+t.getDate(); }
  function vdate(v){ if(!v) return ""; var a=String(v).split("-"); return a[0]+"."+(+a[1])+"."+(+a[2])+" 다녀옴"; }
  function safeU(u){ return /^\/media\/trip\/[\w\-./]+$/.test(String(u||""))?u:""; }

  var ME={login:false}, TAB="photo", SORT="new", NEXT="", POS=null, ITEMS=[], USER="", REGION="", SCOPE="kr";
  function setTabOn(t){ Array.prototype.forEach.call($("tabs").querySelectorAll("button[data-t]"),function(x){ x.classList.toggle("on",x.getAttribute("data-t")===t); }); }

  /* 닫기 — 홈 위 덮개로 열렸으면 덮개만 */
  $("close").onclick=function(){ try{ if(window.parent!==window&&window.parent.cfPageClose){ window.parent.cfPageClose(); return; } }catch(e){} location.href="/"; };
  document.addEventListener("click",function(e){ var x=e.target.closest&&e.target.closest("[data-x]"); if(x) closeSheet(x.getAttribute("data-x")); });
  function openSheet(id){ $(id).classList.add("on"); document.body.style.overflow="hidden"; }

  function loginGo(){
    try{ if(window.parent!==window&&window.parent.cfPageClose){ var P=window.parent; P.cfPageClose(); setTimeout(function(){ var els=P.document.querySelectorAll("button,a"); for(var i=0;i<els.length;i++){ var t=(els[i].textContent||"").trim(); if(t==="로그인하기"||t==="로그인"){ els[i].click(); return; } } },300); return; } }catch(e){}
    location.href="/";
  }
  function needLogin(){ say('로그인이 필요해요. <button type="button" class="more" id="lg" style="display:inline-block;margin:6px 0 0">로그인하기</button>'); var b=$("lg"); if(b) b.onclick=loginGo; window.scrollTo(0,0); }

  /* ── 탭 · 정렬 ── */
  $("tabs").addEventListener("click",function(e){ var b=e.target.closest("button[data-t]"); if(!b) return; TAB=b.getAttribute("data-t"); USER=""; setTabOn(TAB); $("sorts").style.display=(TAB==="shorts"||TAB==="photo")?"":"none"; load(true); });
  $("sorts").addEventListener("click",function(e){ var b=e.target.closest("button[data-s]"); if(!b) return; var s=b.getAttribute("data-s");
    var go=function(){ SORT=s; Array.prototype.forEach.call($("sorts").children,function(x){ x.classList.toggle("on",x===b); }); load(true); };
    if(s==="near"&&!POS){ if(!navigator.geolocation){ say("이 기기에서는 위치를 쓸 수 없어요."); return; } say("내 위치를 확인하는 중…",true);
      navigator.geolocation.getCurrentPosition(function(p){ POS={lat:p.coords.latitude,lng:p.coords.longitude}; say(""); go(); },function(){ say("위치 권한을 허용하면 가까운 순으로 볼 수 있어요."); },{enableHighAccuracy:false,timeout:10000,maximumAge:600000}); return; }
    go(); });
  $("more").onclick=function(){ load(false); };

  function load(reset){
    if(reset){ NEXT=""; ITEMS=[]; $("grid").innerHTML=""; say(""); $("ahead").innerHTML=""; if(TAB==="shorts") drawMyShorts(); }
    $("fab").textContent=TAB==="ask"?"＋ 질문하기":"＋ 올리기";

    if(TAB==="map"){ return loadMap(); }
    if(TAB==="tmap"){ return loadTmaps(); }
    var q="?op=feed";
    if(TAB==="shorts"||TAB==="photo"){ q+="&kind="+TAB+"&sort="+SORT; if(SORT==="near"&&POS) q+="&lat="+POS.lat+"&lng="+POS.lng; }

  }
  function adate(v){ if(!v) return ""; var a=String(v).split("-"); return (+a[1])+"."+(+a[2])+" 출발"; }

  $("grid").addEventListener("click",function(e){ var c=e.target.closest(".cd"); if(!c) return; var id=+c.getAttribute("data-id"); var it=ITEMS.filter(function(x){ return x.id===id; })[0]; if(!it) return;

  /* ── 쇼츠 넘기기 ── */
  var muted=true, io=null;
  function openReel(startId){

  /* v432 구글 지도 경로 (Maps Embed API · directions: 출발 → 들르는 곳 → 도착) */

  function gWp(s){ return s.pid?"place_id:"+s.pid:s.name+(s.addr?", "+s.addr:""); }

    var u="https://www.google.com/maps/embed/v1/directions?key="+k+"&language=ko&origin="+encodeURIComponent(gPt(st[0]))+"&destination="+encodeURIComponent(gPt(st[st.length-1]));
    var mid=st.slice(1,-1).map(gWp); if(mid.length) u+="&waypoints="+mid.map(encodeURIComponent).join("|");
    return u;
  }

  function getFrom(cb){

  }

    })["catch"](function(e){ go.disabled=false; $("pg").style.display="none"; wsay(e.s===402?CHARGE:esc(e.message||"올리지 못했어요")); });
  }

  /* ── 시작 ── */
  api("GET","?op=me").then(function(j){
    ME=j||{login:false}; if(ME.admin) $("tabAdmin").hidden=false;
    var m=/[?&]p=(\d+)/.exec(location.search); if(m) openPost(+m[1]);
    var mm=/[?&]m=(\d+)/.exec(location.search); if(mm) openTmap(+mm[1]);   /* v429 테마 지도 링크 */
    var pl=/[?&]pl=(\d+)\.([0-9a-z]{12})/.exec(location.search); if(pl) openSharedPlan(+pl[1],pl[2]);   /* v461 🔗 공유받은 일정 */
  });
  /* v461 ?t=map → 처음부터 그 탭 (홈 'AI 여행 파트너'의 🗓 일정짜기) */
  var tq=/[?&]t=(photo|shorts|map|tmap|mine|follow|ask)\b/.exec(location.search); if(tq){ TAB=tq[1]; setTabOn(TAB); $("sorts").style.display=(TAB==="shorts"||TAB==="photo")?"":"none"; }
  load(true);
})();
</script>
