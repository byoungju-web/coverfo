    if(!S.tok) h+='<div class="login"><span style="flex:1">로그인하면 같이 정하기 결정 · 이미지 · 앱 작업도 여기에 모여요.</span><button type="button" data-a="login">로그인</button></div>';
    h+='<div class="hd"><b>'+(S.filter==="all"?'최신 작업':'최근 '+(F.filter(function(f){ return f[0]===S.filter; })[0]||["",""])[1])+'<i>'+list.length+'</i></b><a href="/studio" target="_top">전체 보기 →</a></div>';
    h+=list.length?list.map(function(x){ return card(x,S.items.indexOf(x)); }).join(""):'<div class="empty">아직 만든 것이 없어요.<br>아래 <b>＋ 새로 만들기</b>로 시작해 보세요.</div>';
    h+='<div class="msg" id="msg" role="status"></div>';
    h+='<div class="two"><button type="button" class="n" data-a="new">＋ 새로 만들기</button><button type="button" class="g" data-a="pdy">'+GRAPE+'포도야에게 맡기기</button></div>';
    var ds=S.shares.slice(0,5);
    h+='<div class="hd"><b>내 결정 기록</b><small style="font-size:12px;font-weight:800;color:var(--pri)">'+(S.shares.length?'최근 '+S.shares.length+'건':'')+'</small></div>';
    h+=ds.length?'<div class="tl">'+ds.map(function(x){ return '<div class="e"><small>'+esc(when(x.created_at))+'</small><b>'+esc(x.final?x.final:x.title)+'</b><em>'+(x.people||0)+'명 투표 · '+(x.final?'확정':'진행 중')+'</em><button type="button" data-see="'+esc(x.id)+'">보기 ›</button></div>'; }).join("")+'</div>'
      :'<div class="empty" style="padding:18px">아직 같이 정한 기록이 없어요.<br>친구에게 링크 하나로 투표를 받아 보세요.</div>';
    h+='<button type="button" class="tip" data-new="shorts">여행 사진으로 30초 쇼츠를 만들어 볼까요?<i>›</i></button>';
    h+='<p class="note">결정 링크는 30일 동안 보관돼요. 여행쇼츠는 이 휴대폰에만 보관돼요.</p>';
    $("main").innerHTML=h;
  }

  /* ── 누르기 ── */
  function preview(title,html,url,kind){
    $("pvt").textContent=title||"미리보기";
    var b=$("pvb"); b.innerHTML="";
    if(html){ var f=document.createElement("iframe"); f.setAttribute("sandbox","allow-scripts"); f.srcdoc=html; b.appendChild(f); }
    else if(kind==="vid"){ var v=document.createElement("video"); v.src=url; v.controls=true; v.playsInline=true; v.autoplay=true; b.appendChild(v); }
    else { var im=document.createElement("img"); im.src=url; im.alt=title||""; b.appendChild(im); }
    $("pv").classList.add("on");
  }
  function act(x,n){
    if(!x) return;
    if(x.k==="dec"){
      if(n===1){ var url=location.origin+"/s/"+x.id, text="🗳 "+x.q+"\n같이 정하자! 닉네임만 적고 10초면 투표 끝 👉 "+url;
        if(navigator.share&&!window.CoverfoApp){ navigator.share({title:x.q,text:text}).catch(function(){}); }
        else { try{ navigator.clipboard.writeText(text).then(function(){ msg("✓ 링크를 복사했어요. 카톡에 붙여넣기 하세요."); }); }catch(e){ window.prompt("아래 내용을 복사하세요",text); } } }
      else closeTo("if(window.cfDecide&&cfDecide.see) cfDecide.see(a); else location.href='/s/'+a;",x.id);
      return;
    }
    if(x.k==="sho"){ location.href=n===1?"/shorts/?v="+encodeURIComponent(x.id):"/shorts/"; return; }
    if(x.run){ topGo("/studio?show="+encodeURIComponent(x.id)); return; }
    if(x.k==="img"){ if(n===1){ var dl=document.createElement("a"); dl.href=x.url; dl.download="coverfo-image"; dl.target="_blank"; dl.rel="noopener"; document.body.appendChild(dl); dl.click(); dl.remove(); msg("✓ 이미지를 내려받았어요 (안 되면 새 창에서 길게 눌러 저장)"); } else topGo("/studio?show="+encodeURIComponent(x.id)); return; }
    if(x.k==="vid"){ if(n===1) preview(x.title,"",x.url,"vid"); else topGo("/studio?show="+encodeURIComponent(x.id)); return; }
    /* 앱 · 3D */
    if(n===1&&x.chat){ topGo("/chat/"+encodeURIComponent(x.chat)); return; }
    if(x.html) preview(x.title,x.html,"","app");
  }
  document.addEventListener("click",function(e){
    var t=e.target&&e.target.closest?e.target:null; if(!t) return;
    var b=t.closest("[data-f]"); if(b){ S.filter=b.getAttribute("data-f"); draw(); return; }
    b=t.closest("[data-i]"); if(b){ act(S.items[+b.getAttribute("data-i")],+b.getAttribute("data-b")); return; }
    b=t.closest("[data-see]"); if(b){ closeTo("if(window.cfDecide&&cfDecide.see) cfDecide.see(a); else location.href='/s/'+a;",b.getAttribute("data-see")); return; }
    b=t.closest("[data-new]"); if(b){
      var k=b.getAttribute("data-new"); $("sheet").classList.remove("on");
      if(k==="decide") closeTo("if(window.cfDecide&&cfDecide.open) cfDecide.open(); else location.href='/?go=decide';");
      else if(k==="shorts") location.href="/shorts/";
      else closeTo("var c=document.querySelector('#cf-v17 .v17-sec.violet')||document.getElementById('v4-cr'); if(c) c.scrollIntoView({behavior:'smooth',block:'center'});");
      return;
    }
    b=t.closest("[data-a]"); if(!b) return;
    var a=b.getAttribute("data-a");
    if(a==="new"){ $("sheet").classList.add("on"); return; }
    if(a==="sheetx"){ $("sheet").classList.remove("on"); return; }
    if(a==="pvx"){ $("pv").classList.remove("on"); $("pvb").innerHTML=""; return; }
    if(a==="pdy"){ location.href="/pdy/"; return; }
    if(a==="login"){ closeTo("var q=document.querySelector('#cf-auth .cf-primary'); if(q) q.click();"); return; }
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ if($("pv").classList.contains("on")){ $("pv").classList.remove("on"); $("pvb").innerHTML=""; } else $("sheet").classList.remove("on"); } });
  window.addEventListener("pageshow",function(e){ if(e.persisted) load(); });
  load();
})();
</script>
