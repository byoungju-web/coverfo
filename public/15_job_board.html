(function () {

  var BRAND = "coverfo";
  var seq = 0;
  function makeSvg(size) {
    var uid = "cfl" + (++seq);
    var html = LOGO_SVG
      .replace(/id="cf-/g, 'id="' + uid + '-')
      .replace(/url\(#cf-/g, 'url(#' + uid + '-')
      .replace('width="32"', 'width="' + size + '"')
      .replace('height="32"', 'height="' + size + '"');
    var box = document.createElement("div");
    box.innerHTML = html;
    var el = box.firstElementChild;
    el.setAttribute("data-cf-logo", "1");
    el.style.flex = "none";
    return el;
  }
  function nearBrand(el) {
    var p = el.parentElement;
    for (var i = 0; i < 2 && p; i++) {
      if ((p.textContent || "").indexOf(BRAND) !== -1) return true;
      p = p.parentElement;
    }
    return false;
  }
  function sizeOf(cn, fb) {
    if (cn.indexOf("w-7") !== -1) return 28;
    if (cn.indexOf("w-8") !== -1) return 32;
    if (cn.indexOf("w-9") !== -1) return 36;
    if (cn.indexOf("w-10") !== -1) return 40;
    return fb;
  }
  function run() {
    var els = document.querySelectorAll("div,span");
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.getAttribute("data-cf-done")) continue;
      var txt = (el.textContent || "").trim();
      if (txt !== "c" && txt !== "C") continue;
      var cn = (typeof el.className === "string") ? el.className : "";
      if (cn.indexOf("w-") === -1 || cn.indexOf("rounded") === -1) continue;
      if (!nearBrand(el)) continue;
      el.setAttribute("data-cf-done", "1");
      el.parentNode.replaceChild(makeSvg(sizeOf(cn, 32)), el);
    }
    var svgs = document.querySelectorAll("svg");
    for (var j = 0; j < svgs.length; j++) {
      var sv = svgs[j];

      if (!nearBrand(sv)) continue;
      sv.setAttribute("data-cf-done", "1");
      sv.parentElement.replaceChild(makeSvg(w), sv);
    }
  }
  var t = 0;

})();
